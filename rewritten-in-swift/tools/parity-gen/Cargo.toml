# Documentation only: the scratch crate is generated by generate.sh, which
# writes its own manifest with a `[workspace]` marker so Cargo does not try to
# treat this directory (or the Swift package) as a workspace root.
#
# See docs/PARITY.md for why the generator copies src/{game,rng,road}.rs
# verbatim instead of depending on the canonical crate through Cargo.
[workspace]
[package]
name = "speed-race-parity-gen"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "parity-gen"
path = "crate_root.rs"
